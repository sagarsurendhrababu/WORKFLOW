name: Sync Branch on Label

on:
  pull_request:
    types: [labeled]

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create Sync Branch and PR
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          LABEL="${{ github.event.label.name }}"
          PR="${{ github.event.pull_request.number }}"
          SOURCE="${{ github.event.pull_request.head.ref }}"

          case "$LABEL" in

            dev)
              TARGET="dev"
              ;;

            stage)
              if [[ "$SOURCE" == "dev" ]]; then
                TARGET="stage"
              else
                exit 0
              fi
              ;;

            release)
              if [[ "$SOURCE" == "stage" ]]; then
                TARGET="release"
              else
                exit 0
              fi
              ;;

            main)
              if [[ "$SOURCE" == "release" ]]; then
                TARGET="main"
              else
                exit 0
              fi
              ;;

            *)
              exit 0
              ;;
          esac

          SYNC_BRANCH="sync/${PR}-${TARGET}"

          git checkout "$SOURCE"
          git pull origin "$SOURCE"
          git checkout -b "$SYNC_BRANCH"
          git push -f origin "$SYNC_BRANCH"

          SYNC_OUTPUT=$(gh pr create \
            --base "$TARGET" \
            --head "$SYNC_BRANCH" \
            --title "Sync from $SOURCE to $TARGET" \
            --body "Sync PR created for original PR #$PR" \
            --label "sync" 2>&1 || true)

          SYNC_PR_URL=$(echo "$SYNC_OUTPUT" | grep -Eo "https://github.com[^ ]+")
          if [ -z "$SYNC_PR_URL" ]; then
            SYNC_PR_URL=$(gh pr list --head "$SYNC_BRANCH" --base "$TARGET" --state open --limit 1 | awk '{print $NF}')
          fi

          gh pr comment "$PR" --body "Sync PR created: ${SYNC_PR_URL}"
